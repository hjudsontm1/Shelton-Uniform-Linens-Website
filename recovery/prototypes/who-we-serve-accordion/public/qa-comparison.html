<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelton Prototype QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #20242a; color: #fff; font-family: Arial, sans-serif; }
      h1 { margin: 0 0 24px; font-size: 22px; }
      section { margin-bottom: 34px; }
      h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; color: #c9cdd2; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      img { display: block; width: 100%; height: auto; border: 1px solid #555b63; background: #081321; }
    </style>
  </head>
  <body>
    <h1>Shelton standalone prototype: source and implementation</h1>
    <section>
      <h2>Industry accordion</h2>
      <div class="pair">
        <figure><figcaption>Source</figcaption><img src="/assets/qa/source-accordion.png" alt="Source accordion mockup" /></figure>
        <figure><figcaption>Implementation</figcaption><img src="/assets/qa/implementation-accordion.png" alt="Implemented five-panel accordion" /></figure>
      </div>
    </section>
    <section>
      <h2>Ownership-model rows</h2>
      <div class="pair">
        <figure><figcaption>Source</figcaption><img src="/assets/qa/source-models.png" alt="Source ownership-model rows" /></figure>
        <figure><figcaption>Implementation</figcaption><img src="/assets/qa/implementation-models.png" alt="Implemented ownership-model rows" /></figure>
      </div>
    </section>
  </body>
</html>
